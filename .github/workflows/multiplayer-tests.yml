name: Multiplayer engine tests
on:
  push:
    branches: [feat/v1-1-multiplayer-foundation]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'functions/**'
      - 'database.rules.json'
      - '.github/workflows/multiplayer-tests.yml'
jobs:
  bingo-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/bingo-engine.test.mjs
      - run: node --check functions/index.js
      - run: node --check multiplayer.js
      - run: node --check tv.js
      - run: node -e "JSON.parse(require('node:fs').readFileSync('database.rules.json','utf8'))"
  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save firebase@12 @firebase/rules-unit-testing@5 firebase-tools@14
      - run: npx firebase emulators:exec --project demo-telajunto-rules --only database "node --test tests/database-rules.test.mjs"
