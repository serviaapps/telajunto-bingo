<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>TelaJunto — Painel da TV — Homologação</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:white;font-family:system-ui,Arial,sans-serif;text-align:center}.screen{min-height:100vh;display:flex;flex-direction:column;justify-content:space-around;gap:1rem;padding:3vw}.eyebrow{font-size:clamp(18px,2vw,30px);color:#ffbd67;letter-spacing:.15em}.ball{font-size:clamp(100px,20vw,310px);font-weight:900;line-height:1.1;color:#ffbd67}.meta{font-size:clamp(20px,3vw,42px)}.history{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;max-height:24vh;overflow:auto}.history span{display:inline-grid;place-items:center;width:clamp(40px,5vw,68px);height:clamp(40px,5vw,68px);border-radius:50%;background:#25364f;font-size:clamp(18px,2.5vw,30px);font-weight:700}.hint{color:#9aabc1;font-size:clamp(16px,2vw,24px)}input,button{font-size:22px;padding:14px;border-radius:10px}button{background:#ffbd67;color:#101827;border:0;font-weight:700}input{max-width:220px;text-transform:uppercase}#connect{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}</style></head><body><main class="screen"><div><div class="eyebrow">TELAJUNTO • BINGO NA TV</div><div id="status" class="hint" role="status">Conectando ao emulador local…</div></div><div><div class="eyebrow">ÚLTIMO NÚMERO SORTEADO</div><div id="ball" class="ball">—</div><div id="count" class="meta">0 de 90 números</div></div><div><div id="history" class="history"></div></div><div><div id="room" class="meta"></div><form id="connect"><input id="code" aria-label="Código da sala" placeholder="Código da sala" maxlength="6" required><button type="submit">Exibir partida</button></form><p class="hint">Esta tela mostra somente o sorteio público. Nenhuma cartela aparece na TV.</p></div></main><script type="module" src="./tv-homolog.js"></script></body></html>
